[project]
name = "analysisrun"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.1",
    "pandas>=2.2.3",
    "pydantic>=2.11.3",
    "questionary>=2.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analysisrun"]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pandas-stubs>=2.2.3.250308",
    "pixelmatch>=0.3.0",
    "pytest>=8.4.0",
    "ruff>=0.16.3",
]

[tool.ruff.lint]
extend-select = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.basedpyright]
include = ["src/analysisrun/pipeline.py", "src/analysisrun/pipeline_parallel.py"]
typeCheckingMode = "standard"
pythonVersion = "3.13"
reportMissingParameterType = "error"
reportUnknownParameterType = "error"
reportMissingTypeArgument = "error"
